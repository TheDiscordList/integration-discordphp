name: Release

# Packagist builds versions from tags through its GitHub hook; this workflow
# only gates the tag and writes the GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Tag matches Autoposter::VERSION
        run: |
          version="$(grep -oP "public const VERSION = '\K[^']+" src/Autoposter.php)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Autoposter::VERSION ${version}"
            exit 1
          fi
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
