name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          # Keeps the ^10.1 DiscordPHP floor a fact rather than a claim.
          - php: '8.2'
            dependencies: lowest
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
        if: matrix.dependencies == 'highest'
      - run: vendor/bin/pint --test
        if: matrix.dependencies == 'highest'

  php81:
    # The package supports 8.1; PHPUnit 11 does not, so 8.1 gets a parse check.
    name: Sources parse on PHP 8.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: none
      - run: find src examples -name '*.php' -print0 | xargs -0 -n1 php -l
